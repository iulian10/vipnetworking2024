name: Actualizare cifre site
on:
  schedule:
    - cron: "0 4 * * *"   # zilnic la 06:00/07:00 ora României
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q yt-dlp
      - run: python scripts/update_stats.py
      - name: Salvează dacă s-a schimbat ceva
        run: |
          if ! git diff --quiet stats.json; then
            git config user.name "actualizare-automata"
            git config user.email "actions@users.noreply.github.com"
            git add stats.json && git commit -m "Cifre actualizate automat" && git push
          fi
